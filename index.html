<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory game</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>


<body>
    <h1>Memory Game </h1>
    <p>You have to find all matching cards beforee the time ends</p>
    <div class="StartGame">
        <p id="timerId">Time:remminnig</p>
        <button id="startID">Start Game</button>
    </div>

    <button id="playAgain"></button>
    <div class="cardClass">


            <div class="card" data-name="paris">
                <div class="front">
                <img src="assests/paris (1).svg" alt="Captial of France">
                </div>
                <div class="back"></div>
            </div>
       
            <div class="card" data-name="abu-dhabi">
                <div class="frontt"><img src="assests/abu-dhabi (1).svg" alt="Captial of UAE">
                </div>
                
                <div class="back"></div>
            </div>


            <div class="card" data-name="cairo">
                <div class="front"><img src="assests/cairo.svg" alt="Captial of Eygpt">
                </div>
                
                <div class="back"></div>
            </div>


            <div class="card" data-name="ottawa">
                <div class="front">
                  <img src="assests/ottawa.svg" alt="Captial of Kanada">  
                </div>
                
                <div class="back"></div>
            </div>
            
            <div class="card" data-name="tokyo">
                <div>
                    <img src="assests/tokyo.svg" alt="Captial of Japan">

                </div>
                <div class="back"></div>
            </div>
           
             
            <div class="card" data-name="rome">
                <div class="front"><img src="assests/rome (1).svg" alt="Captial of Italy">
                </div>
                
                <div class="back"></div>
            </div>
            
        </div>
       
    

        </div>
</body>
</html>
